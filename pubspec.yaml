
name: to_do
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/todo_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
